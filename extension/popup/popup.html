<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="header">
    <img src="../icons/icon32.png" alt="tur" class="logo">
    <h1 style="font-size: xxx-large;">tur</h1>
  </div>

  <div id="status-container" class="status-box">
    <div class="status-indicator"></div>
    <span id="status-text">Checking status...</span>
  </div>

  <div id="action-container" class="action-box">
    <!-- Injected by JS -->
  </div>

  <details class="settings-box">
    <summary>Appearance</summary>
    <div class="settings-content">
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="design" value="v1" checked>
          <span>Default</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="design" value="v2">
          <span>Large (Margin Font)</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="design" value="v3">
          <span>Text Only</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="design" value="v4">
          <span>Logo Only</span>
        </label>
      </div>
    </div>
  </details>

  <script src="popup.js"></script>
</body>

</html>
